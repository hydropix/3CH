name: Build

# Every push and pull request: tests, then Windows and macOS builds
# (downloadable from the run's "Artifacts").
# Pushing a tag such as v2.0.1 also publishes them as a GitHub Release,
# which the README download links point to.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test

  build:
    name: build (${{ matrix.platform }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            files: |
              app/dist/3CH-Setup.exe
              app/dist/3CH-Portable.exe
          - os: macos-latest
            platform: mac
            files: app/dist/3CH-mac.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # The Piper voices (about 185 MB) are not in git: fetched once, cached.
      - uses: actions/cache@v4
        with:
          path: app/voices
          key: voices-${{ hashFiles('app/src/piper.js', 'app/scripts/fetch-voices.js') }}
      - run: npm run voices
      # npm only installs the speech addon of the runner (Apple Silicon); the
      # universal build also needs the Intel one. Without it, Intel Macs fall
      # back to the system voice.
      - name: Add the Intel macOS speech addon
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          version=$(node -p "require('sherpa-onnx-node/package.json').version")
          npm pack "sherpa-onnx-darwin-x64@$version" --silent
          mkdir -p node_modules/sherpa-onnx-darwin-x64
          tar -xzf sherpa-onnx-darwin-x64-*.tgz -C node_modules/sherpa-onnx-darwin-x64 --strip-components=1
          rm sherpa-onnx-darwin-x64-*.tgz
      - name: Package
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          # No signing certificate: Windows builds are unsigned, macOS builds are ad-hoc signed.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: 3CH-${{ matrix.platform }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        working-directory: .
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="[$version]" '/^## /{p = index($0, v) > 0; next} p' CHANGELOG.md > notes.md
          test -s notes.md || echo "See [CHANGELOG.md](CHANGELOG.md)." > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: notes.md
